service: tire1000

frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs20.x
  architecture: arm64
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  logRetentionInDays: 14
  environment:
    TABLE_NAME: ${self:custom.tableName}
    STAGE: ${self:provider.stage}
    USER_POOL_ID: !Ref CognitoUserPool
    USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
    STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY, ''}
    STRIPE_PRICE_ID: ${env:STRIPE_PRICE_ID, ''}
    STRIPE_WEBHOOK_SECRET: ${env:STRIPE_WEBHOOK_SECRET, ''}
    FRONTEND_URL: ${env:FRONTEND_URL, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
          Resource:
            - !GetAtt MainTable.Arn
            - !Sub ${MainTable.Arn}/index/*
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminDeleteUser
          Resource: !GetAtt CognitoUserPool.Arn
  httpApi:
    cors: true
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}
        audience:
          - !Ref CognitoUserPoolClient

custom:
  tableName: ${self:service}-${self:provider.stage}-MainTable
  userPoolName: ${self:service}-${self:provider.stage}-user-pool

package:
  individually: true
   
build:
  esbuild:
    configFile: ./esbuild.config.mjs

functions:
  authSignup:
    handler: src/main/handlers/auth/signup.handler
    events:
      - httpApi:
          path: /auth/signup
          method: post
  authLogin:
    handler: src/main/handlers/auth/login.handler
    events:
      - httpApi:
          path: /auth/login
          method: post
  themesList:
    handler: src/main/handlers/themes/list-themes.handler
    events:
      - httpApi:
          path: /themes
          method: get
          authorizer:
            name: cognitoAuthorizer
  themesGet:
    handler: src/main/handlers/themes/get-theme.handler
    events:
      - httpApi:
          path: /themes/{themeId}
          method: get
          authorizer:
            name: cognitoAuthorizer
  topicsList:
    handler: src/main/handlers/topics/list-topics.handler
    events:
      - httpApi:
          path: /topics
          method: get
          authorizer:
            name: cognitoAuthorizer
  usersMe:
    handler: src/main/handlers/users/me.handler
    events:
      - httpApi:
          path: /users/me
          method: get
          authorizer:
            name: cognitoAuthorizer
  creditsCheckout:
    handler: src/main/handlers/credits/checkout.handler
    events:
      - httpApi:
          path: /credits/checkout
          method: post
          authorizer:
            name: cognitoAuthorizer
  creditsWebhook:
    handler: src/main/handlers/credits/webhook.handler
    events:
      - httpApi:
          path: /credits/webhook
          method: post
  # Invoked directly by Cognito as the PreTokenGeneration trigger (see the
  # CognitoUserPool's LambdaConfig below) — no httpApi event.
  authPreTokenGeneration:
    handler: src/main/handlers/auth/pre-token-generation.handler
  # Further functions are added by feature tickets as they implement
  # endpoints/consumers. Authenticated routes attach the `cognitoAuthorizer`
  # defined above (see above).

resources:
  Resources:
    # Single-table design. See spec's "Modelo de dados" section for the full
    # entity-to-key mapping (PK/SK/GSI1PK/GSI1SK/GSI2PK/GSI2SK per entity).
    MainTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tableName}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: false
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
          - AttributeName: GSI2PK
            AttributeType: S
          - AttributeName: GSI2SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: GSI2
            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH
              - AttributeName: GSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # Backend controls signup directly (AdminCreateUser + AdminSetUserPassword)
    # so accounts are created already confirmed and verified — no self-service
    # email confirmation flow, no login social (see ticket 02 / spec.md).
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:custom.userPoolName}
        UserPoolTier: ESSENTIALS
        DeletionProtection: ACTIVE
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
            RequireUppercase: true
        # PreTokenGeneration (V2_0) copies the custom:userId attribute set at signup into the
        # access token's `userId` claim, with no DynamoDB lookup — see ADR-0008.
        LambdaConfig:
          PreTokenGenerationConfig:
            LambdaArn: !GetAtt AuthPreTokenGenerationLambdaFunction.Arn
            LambdaVersion: V2_0
        Schema:
          - Name: email
            AttributeDataType: String
            Required: true
            Mutable: true
          - Name: name
            AttributeDataType: String
            Required: true
            Mutable: true
          # Internal User id (KSUID), written once at signup and never changed afterwards.
          - Name: userId
            AttributeDataType: String
            Mutable: false
            StringAttributeConstraints:
              MinLength: "1"
              MaxLength: "64"

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:custom.userPoolName}-client
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH

    CognitoPreTokenGenerationPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref AuthPreTokenGenerationLambdaFunction
        Action: lambda:InvokeFunction
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt CognitoUserPool.Arn
