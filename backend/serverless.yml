service: tire1000

frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    TABLE_NAME: ${self:custom.tableName}
    STAGE: ${self:provider.stage}
    USER_POOL_ID: !Ref CognitoUserPool
    USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
          Resource:
            - !GetAtt MainTable.Arn
            - !Sub ${MainTable.Arn}/index/*
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminDeleteUser
          Resource: !GetAtt CognitoUserPool.Arn
  httpApi:
    cors: true
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}
        audience:
          - !Ref CognitoUserPoolClient

custom:
  tableName: ${self:service}-${self:provider.stage}-MainTable
  userPoolName: ${self:service}-${self:provider.stage}-user-pool
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20

plugins:
  - serverless-esbuild

functions:
  authSignup:
    handler: src/main/handlers/auth/signup.handler
    events:
      - httpApi:
          path: /auth/signup
          method: post
  authLogin:
    handler: src/main/handlers/auth/login.handler
    events:
      - httpApi:
          path: /auth/login
          method: post
  themesList:
    handler: src/main/handlers/themes/list-themes.handler
    events:
      - httpApi:
          path: /themes
          method: get
          authorizer:
            name: cognitoAuthorizer
  themesGet:
    handler: src/main/handlers/themes/get-theme.handler
    events:
      - httpApi:
          path: /themes/{themeId}
          method: get
          authorizer:
            name: cognitoAuthorizer
  topicsList:
    handler: src/main/handlers/topics/list-topics.handler
    events:
      - httpApi:
          path: /topics
          method: get
          authorizer:
            name: cognitoAuthorizer
  # Further functions are added by feature tickets as they implement
  # endpoints/consumers. Authenticated routes attach the `cognitoAuthorizer`
  # defined above (see above).

resources:
  Resources:
    # Single-table design. See spec's "Modelo de dados" section for the full
    # entity-to-key mapping (PK/SK/GSI1PK/GSI1SK/GSI2PK/GSI2SK per entity).
    MainTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
          - AttributeName: GSI2PK
            AttributeType: S
          - AttributeName: GSI2SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: GSI2
            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH
              - AttributeName: GSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # Backend controls signup directly (AdminCreateUser + AdminSetUserPassword)
    # so accounts are created already confirmed and verified — no self-service
    # email confirmation flow, no login social (see ticket 02 / spec.md).
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:custom.userPoolName}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
            RequireUppercase: true
        Schema:
          - Name: email
            AttributeDataType: String
            Required: true
            Mutable: true
          - Name: name
            AttributeDataType: String
            Required: true
            Mutable: true

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:custom.userPoolName}-client
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
