authSignup:
  handler: src/main/handlers/auth/signup.handler
  environment:
    USER_POOL_ID: !Ref CognitoUserPool
    USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
  events:
    - httpApi:
        path: /auth/signup
        method: post

authLogin:
  handler: src/main/handlers/auth/login.handler
  environment:
    USER_POOL_ID: !Ref CognitoUserPool
    USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
  events:
    - httpApi:
        path: /auth/login
        method: post

# Invoked directly by Cognito as the PreTokenGeneration trigger (see the CognitoUserPool's
# LambdaConfig in resources/cognito.yml) — no httpApi event. Doesn't use USER_POOL_ID/CLIENT_ID or
# any cognito-idp action, so it gets its own dedicated role (AuthPreTokenGenerationRole) instead of
# the shared execution role: if this function depended back on CognitoUserPool (via role or env
# var), it would close a cycle, since CognitoUserPool already references this function in
# LambdaConfig. See ADR-0010.
authPreTokenGeneration:
  handler: src/main/handlers/auth/pre-token-generation.handler
  role: !GetAtt AuthPreTokenGenerationRole.Arn
