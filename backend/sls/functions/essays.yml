essaysUpload:
  handler: src/main/handlers/essays/upload-essay.handler
  events:
    - httpApi:
        path: /essays
        method: post
        authorizer:
          name: cognitoAuthorizer

essaysResend:
  handler: src/main/handlers/essays/resend-essay.handler
  events:
    - httpApi:
        path: /essays/{essayId}
        method: post
        authorizer:
          name: cognitoAuthorizer

essaysGet:
  handler: src/main/handlers/essays/get-essay-detail.handler
  events:
    - httpApi:
        path: /essays/{essayId}
        method: get
        authorizer:
          name: cognitoAuthorizer

essaysList:
  handler: src/main/handlers/essays/list-user-essays.handler
  events:
    - httpApi:
        path: /essays
        method: get
        authorizer:
          name: cognitoAuthorizer

# Invoked directly by the EssaysBucket's ObjectCreated notification — the bucket is created by
# this same service (see resources/essays.yml), so `existing: true` tells Serverless to only
# attach the notification, not to also manage the bucket itself.
essaysEnqueueValidation:
  handler: src/main/handlers/essays/enqueue-essay-validation.handler
  events:
    - s3:
        bucket: ${self:custom.essaysBucketName}
        event: s3:ObjectCreated:*
        existing: true

# Consumer of the fila de Revisão. batchSize: 1 so one essay's failure doesn't hold up another's.
# Function timeout stays under the queue's VisibilityTimeout (120s, see resources/essays.yml) so a
# message doesn't become visible to another poller while this invocation is still running.
essaysValidate:
  handler: src/main/handlers/essays/validate-essay.handler
  timeout: 90
  events:
    - sqs:
        arn: !GetAtt EssayValidationQueue.Arn
        batchSize: 1

# Consumer of the fila de Avaliação. batchSize: 1, same reasoning as essaysValidate. Timeout stays
# under the queue's VisibilityTimeout (120s, see resources/essays.yml) — 5 concurrent Gemini calls
# (one per competência) fit comfortably inside it.
essaysEvaluate:
  handler: src/main/handlers/essays/evaluate-essay.handler
  timeout: 90
  events:
    - sqs:
        arn: !GetAtt EssayEvaluationQueue.Arn
        batchSize: 1
