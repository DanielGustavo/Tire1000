# Client uploads the essay photo directly here via presigned POST (UploadEssay/ResendEssay) —
# the `essaysEnqueueValidation` function (see functions/essays.yml) attaches the ObjectCreated
# notification.
EssaysBucket:
  Type: AWS::S3::Bucket
  Properties:
    BucketName: ${self:custom.essaysBucketName}
    CorsConfiguration:
      CorsRules:
        # Presigned POST carries its own single-use, time-boxed policy — an open origin here
        # doesn't widen what a request can do, so this is fine for MVP.
        - AllowedOrigins: ["*"]
          AllowedMethods: [POST]
          AllowedHeaders: ["*"]
          MaxAge: 3000
    LifecycleConfiguration:
      Rules:
        # Backstop, not the primary cleanup path: ValidateEssay (ticket 06) deletes the object
        # itself the moment Revisão finishes (success or rejection). This just guarantees that
        # anything which slips through — an object whose EnqueueEssayValidation trigger never
        # fired, for instance — doesn't sit in the bucket forever.
        - Id: ExpireOrphanedUploads
          Status: Enabled
          ExpirationInDays: 7

# Fila de Revisão (spec's "Envio, Revisão e Avaliação de redação") — EnqueueEssayValidation
# produces here; ValidateEssay (ticket 06) is the consumer.
EssayValidationDLQ:
  Type: AWS::SQS::Queue
  Properties:
    QueueName: ${self:custom.essayValidationDlqName}
    MessageRetentionPeriod: 1209600 # 14 dias

EssayValidationQueue:
  Type: AWS::SQS::Queue
  Properties:
    QueueName: ${self:custom.essayValidationQueueName}
    VisibilityTimeout: 120
    ReceiveMessageWaitTimeSeconds: 20
    RedrivePolicy:
      deadLetterTargetArn: !GetAtt EssayValidationDLQ.Arn
      maxReceiveCount: 3

# Fila de Avaliação — ValidateEssay produces here on a VALIDATED essay; EvaluateEssay (ticket 07) is
# the consumer. Same RedrivePolicy shape as EssayValidationQueue (maxReceiveCount: 3, matching
# MAX_ESSAY_EVALUATION_ATTEMPTS) — a message that fails 3 deliveries lands in EssayEvaluationDLQ for
# the team to fix and redrive (ADR-0001: no credit refund, reprocess the same essay instead).
EssayEvaluationDLQ:
  Type: AWS::SQS::Queue
  Properties:
    QueueName: ${self:custom.essayEvaluationDlqName}
    MessageRetentionPeriod: 1209600 # 14 dias

EssayEvaluationQueue:
  Type: AWS::SQS::Queue
  Properties:
    QueueName: ${self:custom.essayEvaluationQueueName}
    VisibilityTimeout: 120
    ReceiveMessageWaitTimeSeconds: 20
    RedrivePolicy:
      deadLetterTargetArn: !GetAtt EssayEvaluationDLQ.Arn
      maxReceiveCount: 3

# Dev-facing alerts (ValidateEssay's system-failure/rejection-threshold branches, spec's stories 31-32).
# Reused as-is by EvaluateEssay in ticket 07 for the same kind of alert on the fila de Avaliação.
DevAlertsTopic:
  Type: AWS::SNS::Topic
  Properties:
    TopicName: ${self:custom.devAlertsTopicName}

DevAlertsSubscription:
  Type: AWS::SNS::Subscription
  Properties:
    TopicArn: !Ref DevAlertsTopic
    Protocol: email
    Endpoint: ${self:custom.devAlertEmail}
